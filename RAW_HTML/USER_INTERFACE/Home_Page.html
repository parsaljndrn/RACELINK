<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RaceLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    font-family: 'Righteous', sans-serif;
    background-color: #d1d1d1;
    display: flex;
  }

  .sidebar {
    background-color: #111;
    color: white;
    width: 250px;
    height: 594px;
    display: flex;
    justify-content: center;
    align-items: center;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-weight: bold;
    font-size: 100px;
  }
  .home-page {
    flex-grow: 1;
    padding: 30px 40px;
  }
  nav {
    display: flex;
    justify-content: flex-start;
    gap: 20px;
    padding-bottom: 20px;
    font-weight: 600;
  }
  nav a {
    text-decoration: none;
    color: black;
    font-size: 0.9rem;
  }
  nav a:hover {
    color: #eeaa00;
  
  }
  h1 {
    font-weight: 700;
    margin-top: 40;
    font-size: 72px;
  }
  .subheading {
    color: #eeaa00;
    font-weight: 400;
    font-size: 20px;
  }
  .buttons {
    border-radius: 12px;
    display: flex;
    gap: 15px;
}

button {
    background-color: black;
    color: white;
    border: none;
    padding: 15px 30px;
    cursor: pointer;
    font-weight: 700;
    font-size: 1rem;
    border-radius: 25px;
}
button:hover {
    background-color: #eeaa00;
}
</style>
</head>
<body>

<div class="home-page">
  <nav>
    <a href="#">Dashboard</a>
    <a href="#">Marathons</a>
    <a href="#">About Us</a>
  </nav>
  <h1>Your All-in-One<br />Running <br />Community</h1>
  <p class="subheading">Discover, Connect, and Join Marathons Near You</p>
 <div class="buttons">
    <button class="round-button">Log In</button>
    <button class="round-button">Browse as Guest</button>
</div>
</div>

<div class="sidebar">
  <p class="Sidebar_Text">RaceLink</p>
</div>

</body>
</html>
