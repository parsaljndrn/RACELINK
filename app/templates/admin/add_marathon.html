{% extends 'base.html' %}
{% block content %}
 <form method="POST">
        <label>Marathon Title:</label><br>
        <input type="text" name="title" required><br><br>

        <label>Description:</label><br>
        <textarea name="description" rows="4" cols="40" required></textarea><br><br>

        <label>Date:</label><br>
        <input type="date" name="date" required><br><br>

        <label>Location:</label><br>
        <input type="text" name="location" required><br><br>

        <label>Registration Fee:</label><br>
        <input type="number" name="registration_fee" step="0.01" required><br><br>

        <button type="submit">Add Marathon</button>
    </form>
{% endblock %}
