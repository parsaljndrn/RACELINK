<!DOCTYPE html>
<html>
<head>
    <title>Upload Payment</title>
</head>
<body>
    <h1>Upload Payment for Event {{ event_id }}</h1>

    <form method="POST" enctype="multipart/form-data">
        <label>Upload your payment image:</label><br>
        <input type="file" name="payment_image" accept="image/*" required><br><br>
        <button type="submit">Submit Payment</button>
    </form>

    <p><a href="{{ url_for('main.events') }}">Back to Events</a></p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul>
          {% for category, message in messages %}
            <li><strong>{{ category }}:</strong> {{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
</body>
</html>
