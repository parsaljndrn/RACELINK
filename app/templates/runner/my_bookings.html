<!DOCTYPE HTML><!DOCTYPE html>
<html>
<head>
    <title>My Bookings</title>
</head>
<body>
    <h1>My Bookings</h1>
    <p>Manage your marathon registrations</p>

    <!-- Booking 1 -->
    <div>
        <p><strong>Event name:</strong> Sample Marathon</p>
        <p><strong>Date:</strong> 2025-12-01</p>
        <p><strong>Location:</strong> Manila</p>
        <p><strong>Price:</strong> ₱500</p>
        <form method="POST" action="/cancel_booking/1" style="display:inline;">
            <button type="submit">Cancel</button>
        </form>
        <form method="GET" action="/view_booking/1" style="display:inline;">
            <button type="submit">View Booking</button>
        </form>
    </div>

    <hr>

    <!-- Booking 2 -->
    <div>
        <p><strong>Event name:</strong> City Run 10K</p>
        <p><strong>Date:</strong> 2025-11-20</p>
        <p><strong>Location:</strong> Cebu</p>
        <p><strong>Price:</strong> ₱350</p>
        <form method="POST" action="/cancel_booking/2" style="display:inline;">
            <button type="submit">Cancel</button>
        </form>
        <form method="GET" action="/view_booking/2" style="display:inline;">
            <button type="submit">View Booking</button>
        </form>
    </div>
</body>
</html>
